<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <header class="page-header">
        <h1>Create User</h1>
        <a class="btn secondary" th:href="@{/users}">Back</a>
    </header>

    <form th:action="@{/users}" th:object="${user}" method="post" class="form">
        <div class="field">
            <label for="name">Name</label>
            <input id="name" type="text" th:field="*{name}" placeholder="Enter name">
            <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" placeholder="Enter email">
            <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <button type="submit" class="btn">Save</button>
    </form>
</main>
</body>
</html>
